<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>番茄钟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    h1 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #e94560; }

    /* 计时器显示 */
    #timer-display {
      font-size: 48px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .running { color: #e94560; }
    .paused  { color: #f5a623; }
    .stopped { color: #888; }

    /* 自定义时长 */
    .duration-setter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .duration-setter input {
      width: 60px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #16213e;
      color: #eee;
      text-align: center;
      font-size: 14px;
    }
    .duration-setter span { font-size: 13px; color: #aaa; }

    /* 按钮 */
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-start   { background: #e94560; color: white; }
    .btn-pause   { background: #f5a623; color: white; }
    .btn-resume  { background: #4ecdc4; color: white; }
    .btn-reset   { background: #555; color: #eee; }
    .hidden { display: none !important; }

    /* 统计跳转 */
    .stats-link {
      text-align: center;
      margin-top: 12px;
    }
    .stats-link a {
      color: #4ecdc4;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }
    .stats-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🍅 番茄钟</h1>

  <div id="timer-display" class="stopped">25:00</div>

  <div class="duration-setter">
    <span>时长</span>
    <input type="number" id="duration-input" value="25" min="1" max="120">
    <span>分钟</span>
  </div>

  <div class="btn-group">
    <button id="btn-start" class="btn-start">开始</button>
    <button id="btn-pause" class="btn-pause hidden">暂停</button>
    <button id="btn-resume" class="btn-resume hidden">继续</button>
    <button id="btn-reset" class="btn-reset">重置</button>
  </div>

  <div class="stats-link">
    <a id="stats-link">📊 查看详细统计</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
